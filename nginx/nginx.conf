worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Both API containers. No weights, no ip_hash -> plain round-robin.
    # Works because the app keeps no state of its own (state lives in Postgres + Redis).
    upstream crewlink_api {
        # Shared memory: without it, each nginx worker process keeps its OWN round-robin
        # counter, and every worker's first pick is api1 (found in the Docker test: four
        # new connections all went to api1). With the zone, all workers share one counter.
        zone crewlink_api 64k;
        server api1:8000 max_fails=3 fail_timeout=10s;
        server api2:8000 max_fails=3 fail_timeout=10s;
        # Reused connections. Gunicorn runs gthread workers, which support keep-alive
        # (the default sync workers close every connection, so this would do nothing).
        keepalive 16;
    }

    upstream crewlink_web {
        server web:3000;
    }

    log_format upstream_log '$remote_addr "$request" $status '
                            'upstream=$upstream_addr time=$request_time';
    access_log /dev/stdout upstream_log;
    error_log  /dev/stderr warn;

    # Shared proxy settings for both upstreams. Keep ALL proxy_set_header lines at this
    # level: if a location sets even one, it stops inheriting every one of these.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";    # needed for upstream keepalive
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # SECURITY: nginx is the edge, so OVERWRITE X-Forwarded-For with the address that
    # actually connected. Appending ($proxy_add_x_forwarded_for) would keep whatever the
    # client sent, and a fake value per request would dodge the login rate limit.
    # Django reads the last entry (REST_FRAMEWORK NUM_PROXIES = 1).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8000;
        client_max_body_size 5m;

        # API (round-robin across api1/api2). /health/ is the Django health view.
        location ~ ^/(api/|health/) {
            proxy_pass http://crewlink_api;

            add_header X-Upstream $upstream_addr always;   # which instance answered

            # Retry on the other instance only if this one couldn't be reached.
            # nginx never re-sends a POST that already reached an upstream unless
            # `non_idempotent` is added, and it deliberately isn't: a Send that timed
            # out on api1 must not be quietly replayed on api2.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # Everything else is the Next.js leadership screen.
        location / {
            proxy_pass http://crewlink_web;
        }
    }
}
