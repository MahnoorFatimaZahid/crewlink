# docker compose up --build   ->  API on http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crewlink
      POSTGRES_USER: crewlink
      POSTGRES_PASSWORD: crewlink
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewlink -d crewlink"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine

  # One-shot job: migrate + seed, then exit. Runs once, so two API instances
  # (added later) never race each other running migrations.
  setup:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed"
    env_file: .env.docker
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./backend
    env_file: .env.docker
    ports: ["8000:8000"]
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_started}

volumes:
  pgdata:
