# docker compose up --build   ->  leadership screen on http://localhost:3000
#                                 API on http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crewlink
      POSTGRES_USER: crewlink
      POSTGRES_PASSWORD: crewlink
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewlink -d crewlink"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # One-shot job: migrate + seed, then exit. Runs once, so two API instances
  # (added later) never race each other running migrations.
  setup:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed"
    env_file: .env.docker
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./backend
    # .env is optional and git-ignored: put GEMINI_API_KEY there to use real Gemini.
    # Without it, the API uses the fake AI provider.
    env_file:
      - .env.docker
      - {path: .env, required: false}
    ports: ["8000:8000"]
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  # Fan-out + dispatch jobs. Scale freely: claims use row locks (SKIP LOCKED),
  # so extra workers share the work and never push the same member twice.
  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file: .env.docker
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  # Runs the sweeper every minute. Keep exactly ONE beat: two would just sweep
  # twice (harmless, since the sweeper is idempotent, but wasteful).
  beat:
    build: ./backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file: .env.docker
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  # Leadership screen. The browser talks only to this server; /api/* is proxied
  # to the api service inside the compose network (no CORS needed).
  web:
    build:
      context: ./frontend
      args: {API_URL: "http://api:8000"}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
